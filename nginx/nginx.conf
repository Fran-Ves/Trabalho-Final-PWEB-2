worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Limite compartilhado por TODAS as réplicas (o rate limit da aplicação é por réplica)
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

    # Pool de réplicas. Algoritmo: round-robin (padrão).
    # Para priorizar a réplica com menos conexões ativas, adicione `least_conn;` aqui.
    upstream gym_api {
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        server api3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_tokens off;

        # Brute force no login/cadastro: 20 req/min por IP (burst de 10)
        location /api/auth/ {
            limit_req zone=login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://gym_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Se uma réplica falhar, tenta a próxima
            proxy_next_upstream error timeout http_502 http_503;
            # Mostra qual réplica respondeu (também há o header X-Instance-Id da API)
            add_header X-Upstream $upstream_addr always;
        }

        location / {
            proxy_pass http://gym_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Se uma réplica falhar, tenta a próxima
            proxy_next_upstream error timeout http_502 http_503;
            # Mostra qual réplica respondeu (também há o header X-Instance-Id da API)
            add_header X-Upstream $upstream_addr always;
        }
    }
}
