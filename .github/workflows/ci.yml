name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Build da imagem e validação do Compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Valida o docker-compose.yml
        run: JWT_SECRET=ci-secret-com-mais-de-32-caracteres-aaaaaaaa docker compose config -q
      - name: Build da imagem
        run: docker build -t gym-api:ci .

  publish:
    name: Publica a imagem no GitHub Container Registry
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Converte o nome da imagem para minúsculas
        id: image-name
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image-name.outputs.name }}:latest
            ghcr.io/${{ steps.image-name.outputs.name }}:${{ github.sha }}
