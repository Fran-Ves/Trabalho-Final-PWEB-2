x-api: &api
  build: .
  restart: unless-stopped
  volumes:
    - gym-data:/data
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    start_period: 15s
    retries: 3

x-env: &env
  NODE_ENV: production
  PORT: 3000
  DB_PATH: /data/gym.sqlite
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (mínimo 32 caracteres)}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  TRUST_PROXY: "1"

services:
  api1:
    <<: *api
    environment:
      <<: *env
      INSTANCE_ID: api1

  api2:
    <<: *api
    environment:
      <<: *env
      INSTANCE_ID: api2
    depends_on:
      api1:
        condition: service_healthy

  api3:
    <<: *api
    environment:
      <<: *env
      INSTANCE_ID: api3
    depends_on:
      api1:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy

volumes:
  gym-data:
